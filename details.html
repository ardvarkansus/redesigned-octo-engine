<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Watch Details – VintageWatchSite</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js/clock.js"></script>

  <script>
    // Extract watchId from URL
    function getWatchId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("watchId") || params.get("watch");
    }

    // Navigate back to gallery
    function goBack() {
      window.location.href = "gallery.html";
    }

    // Loupe zoom viewer
    function openLoupe(imgSrc) {
      const loupe = document.getElementById("loupe-viewer");
      const loupeImg = document.getElementById("loupe-img");
      loupeImg.src = imgSrc;
      loupe.style.display = "flex";
    }

    function closeLoupe() {
      document.getElementById("loupe-viewer").style.display = "none";
    }

    // Load watch details dynamically
    async function loadDetails() {
      const watchId = getWatchId();
      if (!watchId) {
        document.getElementById("details-container").innerHTML =
          "<p>No watch selected.</p>";
        return;
      }

      const response = await fetch("watches.json", { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Unable to load watches.json: ${response.status}`);
      }

      const data = await response.json();
      const watch = data.watches.find((item) => item.id === watchId);

      if (!watch) {
        document.getElementById("details-container").innerHTML =
          "<p>Watch not found.</p>";
        return;
      }

      // Build details page
      const imagePath = watch.image || watch.img;
      const movementPath = watch.movement_img;

      document.getElementById("details-container").innerHTML = `
        <h1 class="page-title">${watch.name}</h1>
        <p class="page-subtitle" style="text-align:center;">
          ${watch.brand} — ${watch.jewels} Jewels — ${watch.type}
        </p>

        <div class="details-layout">

          <div class="details-image">
            <img src="${imagePath}" alt="${watch.name}"
                 onclick="openLoupe('${imagePath}')">
            <p style="text-align:center;">Click image to zoom</p>
          </div>

          <div class="details-info">
            <h3>Watch Information</h3>
            <ul>
              <li><strong>Brand:</strong> ${watch.brand}</li>
              <li><strong>Model:</strong> ${watch.name}</li>
              <li><strong>Jewels:</strong> ${watch.jewels}</li>
              <li><strong>Origin:</strong> ${watch.origin}</li>
              <li><strong>Type:</strong> ${watch.type}</li>
            </ul>

            <button class="details-btn" onclick="goBack()">Back to Gallery</button>
          </div>

        </div>

        <h2 class="section-title">Movement</h2>
        ${movementPath ? `
          <div class="movement-section">
            <img src="${movementPath}" alt="Movement"
                 onclick="openLoupe('${movementPath}')">
            <p style="text-align:center;">Click movement to zoom</p>
          </div>
        ` : "<p>Movement image not available.</p>"}
      `;
    }

    window.onload = loadDetails;
  </script>

  <style>
    /* Loupe viewer overlay */
    #loupe-viewer {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    #loupe-img {
      max-width: 90%;
      max-height: 90%;
      border: 4px solid #fff;
      box-shadow: 0 0 20px #000;
    }
    #loupe-close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 28px;
      color: #fff;
      cursor: pointer;
    }
  </style>

</head>

<body>
<body>
