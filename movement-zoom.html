  <main class="content">
    <h1>Movement Zoom</h1>

    <div id="zoomContainer" style="width:100%; height:85vh; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;">
      <img id="zoomImage" src="" alt="Uploaded movement" style="display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain;">
    </div>
  </main>

  <script src="clock.js"></script>
  <script src="main.js"></script>
  <script>
    const imageData = localStorage.getItem("tempMovementImage");
    const zoomImage = document.getElementById("zoomImage");

    if (imageData) {
      zoomImage.src = imageData;
      zoomImage.alt = "Uploaded movement";
    } else {
      document.getElementById("zoomContainer").textContent =
        "No movement image found. Please upload one first.";
    }
  </script>
