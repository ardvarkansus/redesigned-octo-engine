  <main class="content">
    <h1>List Your Watch</h1>

    <form
      id="watchForm"
      action="https://formspree.io/f/mqpablyk"
      method="POST"
      enctype="multipart/form-data"
    >
      <label for="watchName">Watch Name:</label><br>
      <input type="text" id="watchName" name="watchName" required><br>

      <label for="watchBrand">Brand:</label><br>
      <input type="text" id="watchBrand" name="watchBrand" required><br>

      <label for="watchJewels">Jewels:</label><br>
      <input type="number" id="watchJewels" name="watchJewels"><br>

      <label for="watchSize">Size:</label><br>
      <input type="text" id="watchSize" name="watchSize"><br>

      <label for="watchDescription">Description:</label><br>
      <textarea id="watchDescription" name="watchDescription"></textarea><br>

      <label for="watchImage">Upload Watch Image:</label><br>
      <input
        type="file"
        id="watchImage"
        name="watchImage"
        accept="image/*"
        required
      ><br>

      <input
        type="hidden"
        name="_subject"
        value="New VintageWatchSite watch submission"
      >

      <button type="submit">Submit Watch for Review</button>
    </form>
  </main>
