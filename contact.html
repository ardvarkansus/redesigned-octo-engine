  <main class="content">
    <h1>Contact</h1>
    <p>Have questions or want to share your collection? Reach out below.</p>

    <form id="contactForm">
      <label>Name:</label><br>
      <input type="text" id="contactName"><br><br>

      <label>Email:</label><br>
      <input type="email" id="contactEmail"><br><br>

      <label>Message:</label><br>
      <textarea id="contactMessage" rows="6" cols="40"></textarea><br><br>

      <button type="button" onclick="submitContact()">Send Message</button>
    </form>
  </main>

  <script>
    function submitContact() {
      alert("Thank you for your message! We'll get back to you soon.");
      document.getElementById("contactForm").reset();
    }
  </script>
