<main>
  <h2>Upload a Front Watch Image</h2>

  <div class="upload-box">
    <label>Watch Key (example: bulova_accutron_1968)</label>
    <input id="watchKey" type="text" placeholder="Enter the watch key">

    <label>Select Front Watch Image</label>
    <input id="watchImage" type="file" accept="image/*">

    <button class="submit-btn" onclick="uploadFrontImage()">Upload Front Image</button>

    <div id="statusBox" class="status-box"></div>
  </div>
</main>

<div id="zoom-overlay"></div>
<script src="zoom.js"></script>

<script>
async function uploadFrontImage() {
  const key = document.getElementById("watchKey").value.trim();
  const file = document.getElementById("watchImage").files[0];
  const statusBox = document.getElementById("statusBox");

  if (!key || !file) {
    statusBox.style.display = "block";
    statusBox.innerHTML = "Please enter a watch key and select an image.";
    return;
  }

  statusBox.style.display = "block";
  statusBox.innerHTML = "Uploading...";

  try {
    const formData = new FormData();
    formData.append("watchImage", file);
    formData.append("watchKey", key);

    const response = await fetch("https://vintagewatch-upload.<your-subdomain>.workers.dev/uploadWatchImage", {
      method: "POST",
      body: formData
    });

    const result = await response.text();
    statusBox.innerHTML = result;
  } catch (err) {
    statusBox.innerHTML = "Upload failed: " + err;
  }
}
</script>

</body>
